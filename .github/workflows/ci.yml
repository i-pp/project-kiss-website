name: Build and links

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Start the owned static preview in the background
        timeout-minutes: 1
        run: |
          mkdir -p output/playwright
          npm run preview -- --background --port 4321
      - name: Open sandboxed Chrome
        timeout-minutes: 1
        run: npx playwright-cli -s=kiss-review open http://127.0.0.1:4321 --config .playwright/cli.config.json
      - name: Check responsive layout and accessibility
        timeout-minutes: 3
        run: npx playwright-cli -s=kiss-review --json run-code --filename scripts/browser-check.js > output/playwright/browser-run.json
      - name: Close the owned preview and browser
        if: always()
        run: |
          npx playwright-cli -s=kiss-review close
          npx astro preview stop
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: output/playwright/
          retention-days: 7
      - name: Upload the reviewed static output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-site
          path: dist/
          include-hidden-files: true
          retention-days: 7
